[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "armada"
version = "0.1.0"
description = "Pool personal machines to store and run a language model"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["numpy>=1.26,<3", "gguf==0.18.0", "regex"]

[project.scripts]
armada = "armada.cli:main"

[dependency-groups]
checks = ["mypy", "types-regex"]
dev = [{include-group = "checks"}, "llama-cpp-python==0.3.37"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]
